name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # LLR-DP-010, LLR-DP-011: any secret anywhere in the history fails the build. Same gitleaks
  # release as the pre-commit hook, verified against the v8.30.1 release checksums file.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan full history
        run: gitleaks git --redact --no-banner .

  # LLR-VV-002, LLR-VV-009: requirement links, journey coverage, and a current matrix.
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The pre-commit hook test (LLR-DP-011) runs the real gitleaks binary; the checksum
      # comes from the v8.30.1 release's checksums file.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      # The end-to-end script's logic tests import viem (LLR-VV-005).
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Tool tests
        run: node --test test/tools/*.test.mjs
      - name: Trace check
        run: node tools/trace-check.mjs
      - name: Matrix is committed and current
        run: git diff --exit-code docs/TRACE_MATRIX.md

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Test
        if: hashFiles('test/**/*.t.sol') != ''
        run: forge test -vvv
      # LLR-VV-003: 100% of lines, statements, branches, and functions for src/SatStake.sol.
      # The summary is kept in a file rather than piped, so a failure of forge coverage itself
      # fails the step instead of reaching the gate as empty input. The step carries no condition:
      # a repository with no tests has no coverage, which is the failure this gate exists to catch.
      - name: Coverage gate
        run: |
          forge coverage --report summary > coverage-summary.txt
          cat coverage-summary.txt
          node tools/coverage-gate.mjs coverage-summary.txt

  # LLR-FE-080: lint (no any), type check, unit tests, and the testnet build. The app imports its ABI from
  # the Foundry artifact (LLR-FE-081), so the contract is built first.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build the contract artifact
        run: forge build
      - name: Install dependencies
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Lint
        working-directory: app
        run: npm run lint
      - name: Type check
        working-directory: app
        run: npm run typecheck
      - name: Test
        working-directory: app
        run: npm test
      - name: Build for testnet
        working-directory: app
        run: npm run build:testnet
      # Interim, until the mainnet contract exists (06 section 7 asks for a build of both targets): the
      # mainnet build must refuse (LLR-FE-002), and for that reason, not for any other. The mainnet
      # deployment group replaces this step with a real mainnet build.
      - name: Mainnet build refuses without a contract address
        working-directory: app
        run: |
          if npm run build:mainnet > mainnet-build.log 2>&1; then
            echo "the mainnet build succeeded without a contract address"
            exit 1
          fi
          cat mainnet-build.log
          grep -q "mainnet has no SatStake contract address" mainnet-build.log
