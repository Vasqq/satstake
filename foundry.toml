[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Pinned, reproducible build. cancun was confirmed on Arc testnet in Phase 0;
# prague also works but adds nothing this contract uses.
# @trace LLR-SC-001
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Deploy and seed scripts read their inputs from deployments/config and write records to deployments/.
fs_permissions = [
    { access = "read", path = "./deployments/config" },
    { access = "read-write", path = "./deployments" },
]

[fuzz]
runs = 1024

[invariant]
runs = 512
depth = 128
fail_on_revert = false

[fmt]
line_length = 120
