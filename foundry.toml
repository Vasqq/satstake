[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Pinned, reproducible build. cancun was confirmed on Arc testnet in Phase 0;
# prague also works but adds nothing this contract uses.
# @trace LLR-SC-001
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# The AST is the only compiler output that records whether a state variable is constant,
# immutable, or storage; the LLR-SC-005 tests read it from the artifact.
ast = true

# The storage layout gives the slot of each private variable by name, so the tests that read
# bookkeeping storage with `vm.load` do not depend on declaration order.
extra_output = ["storageLayout"]

# Deploy and seed scripts read their inputs from deployments/config and write records to deployments/.
# Tests read compiled artifacts from out/.
# ./src is read so a test can compare the source hash the artifact records with the source on disk,
# which is what tells an artifact left behind by an earlier build from the current one.
fs_permissions = [
    { access = "read", path = "./deployments/config" },
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./out" },
    { access = "read", path = "./src" },
]

[fuzz]
runs = 1024

# @trace LLR-VV-004
# A reverting handler call is a call the contract refused, which belongs in the sequences; the
# handler counts what it reached so a run of refusals cannot pass for a run of work.
[invariant]
runs = 512
depth = 128
fail_on_revert = false

[fmt]
line_length = 120

# Named endpoints, so a deploy, check or seed command does not repeat the URL. They carry no
# credential. The mainnet alias exists for the mainnet group; every mainnet script is simulated
# without --broadcast before it is broadcast.
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc_mainnet = "https://rpc.mainnet.arc.io"
